name: Mutation testing

on:
  pull_request:
    branches: [ "develop", "master" ]
    paths: [ "slick_reporting/**.py" ]

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: .mutmut-cache
          key: mutmut-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: mutmut-${{ github.event.pull_request.number }}-

      - name: Install dependencies
        run: pip install -r tests/requirements.txt "mutmut[patch]==2.5.1"

      # Report only: --CI exits 0 with survivors and 1 on mutmut's own errors.
      - name: Mutate the lines this PR changed
        run: |
          git diff -U0 HEAD^1 HEAD -- 'slick_reporting/*.py' > pr.patch
          mutmut run --use-patch-file pr.patch --CI --no-progress
          python scripts/mutation_report.py pr.patch > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md --edit-last --create-if-none
