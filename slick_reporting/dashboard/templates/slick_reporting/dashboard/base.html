<!doctype html>
{% load static slick_reporting_tags i18n %}
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}Dashboard{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- GridStack -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link href="{% static 'slick_reporting/dashboard/dashboard.css' %}" rel="stylesheet">

    {% block head %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- GridStack JS -->
<script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.js"></script>
<!-- Slick Reporting JS + settings -->
{% include "slick_reporting/js_resources.html" %}
<!-- Chart engines -->
{% get_charts_media "all" as charts_media %}
{{ charts_media }}
<!-- Dashboard JS -->
<script src="{% static 'slick_reporting/dashboard/dashboard.js' %}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
